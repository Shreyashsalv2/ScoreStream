# Tests run on an in-memory H2 database (in MySQL mode) with a simple in-memory cache,
# so they need no MySQL or Redis.
spring:
  datasource:
    url: jdbc:h2:mem:scorestream;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple

app:
  seed-demo-data: false
  admin:
    username: admin
    password: admin12345
